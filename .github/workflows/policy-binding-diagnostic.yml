name: Policy Binding Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile and targeted tests
        run: |
          set +e
          {
            echo "=== COMPILEALL ==="
            python -m compileall -q gnosis tests
            echo "compile_rc=$?"
            echo "=== TARGETED TESTS ==="
            pytest -q tests/test_executable_policy_binding.py tests/test_trusted_execution_gate.py
            echo "pytest_rc=$?"
          } > policy-binding-diagnostic.log 2>&1
          cat policy-binding-diagnostic.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: policy-binding-diagnostic
          path: policy-binding-diagnostic.log
