name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Environment preflight
        run: |
          python --version
          pip --version

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Import preflight
        run: python -c "import gnosis; print(gnosis.__file__)"

      - name: Test collection preflight
        run: pytest --collect-only -q 2>&1 | tee collection.log

      - name: Run tests
        run: pytest -v --cov=gnosis --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Collect runner diagnostics
        if: always()
        run: |
          {
            echo "=== CI CONTEXT ==="
            date -u
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "=== PYTHON ==="
            python --version
            echo "=== PIP ==="
            pip --version
            echo "=== INSTALLED ==="
            pip freeze
            echo "=== FILES ==="
            find . -maxdepth 3 -type f | sort | head -500
          } > ci-diagnostics.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: |
            collection.log
            pytest.log
            ci-diagnostics.log
          if-no-files-found: warn
