name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Environment preflight
        run: |
          python --version
          pip --version
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Import preflight
        run: python -c "import gnosis; print(gnosis.__file__)"
      - name: Test collection preflight
        run: pytest --collect-only -q
      - name: Run tests
        run: pytest -v --cov=gnosis --cov-report=term-missing
