name: E7.107 Readiness Verification
on:
  push:
    paths:
      - "gnosis/self_learning/e7_107_readiness.py"
      - "tests/test_e7_107_readiness.py"
  workflow_dispatch:
jobs:
  e7-107:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run E7.107 tests
        run: pytest -q tests/test_e7_107_readiness.py
