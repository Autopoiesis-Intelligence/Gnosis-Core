name: Audit A1 A2 Authority Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_trusted_execution_gate_tamper.py"
      - ".github/workflows/audit-a1-a2.yml"

jobs:
  authority-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run A1 A2 authority regressions
        run: pytest -q tests/test_trusted_execution_gate_tamper.py
      - name: Audit marker
        run: echo "A1-A2 isolated authority audit"
