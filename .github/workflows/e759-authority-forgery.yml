name: E7.59 Authority Forgery Diagnostic

on:
  push:
    branches:
      - audit/e7-authority-forgery-runtime-20261003
  workflow_dispatch:

jobs:
  authority-forgery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record checkout identity
        run: |
          git rev-parse HEAD | tee diagnostic-head.txt
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run isolated authority-forgery experiment
        id: experiment
        continue-on-error: true
        run: |
          mkdir -p diagnostic-e759
          pytest -q -vv tests/test_authority_boundary.py -k "e759_authority_provenance_rejects_self_created_authorization_before_mutation" 2>&1 | tee diagnostic-e759/test-output.txt
          echo ${PIPESTATUS[0]} > diagnostic-e759/pytest-exit-code.txt

      - name: Upload E7.59 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e759-authority-forgery-${{ github.sha }}
          path: |
            diagnostic-head.txt
            diagnostic-e759/
          if-no-files-found: error

      - name: Fail if diagnostic failed
        if: steps.experiment.outcome == 'failure'
        run: exit 1
