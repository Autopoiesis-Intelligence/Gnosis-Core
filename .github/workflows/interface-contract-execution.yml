name: Interface Contract Execution

on:
  workflow_dispatch:
    inputs:
      core_revision:
        description: "Exact Core revision to execute"
        required: true
        type: string
      execution_id:
        description: "Deterministic execution identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Core revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.core_revision }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Execute canonical contract
        run: |
          mkdir -p interface/reports
          python interface/adapters/gnozis_core/canonical_case.py             --core-revision "${{ inputs.core_revision }}"             --execution-id "${{ inputs.execution_id }}"             --report interface/reports/${{ inputs.execution_id }}.json

      - name: Validate execution report exists
        if: always()
        run: test -s interface/reports/${{ inputs.execution_id }}.json

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.execution_id }}
          path: interface/reports/${{ inputs.execution_id }}.json
          if-no-files-found: error
