name: Interface Contract Execution

on:
  push:
    branches:
      - interface/bootstrap-contract-surface
  workflow_dispatch:
    inputs:
      core_revision:
        description: "Exact Core revision to execute"
        required: true
        type: string
      execution_id:
        description: "Deterministic execution identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target revision
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "revision=${{ inputs.core_revision }}" >> "$GITHUB_OUTPUT"
            echo "execution_id=${{ inputs.execution_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "execution_id=EXE-CORE-MUTATION-BOUNDARY-01-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact Core revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.revision }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest

      - name: Execute canonical contract
        run: |
          mkdir -p interface/reports
          python interface/adapters/gnozis_core/canonical_case.py             --core-revision "${{ steps.target.outputs.revision }}"             --execution-id "${{ steps.target.outputs.execution_id }}"             --report interface/reports/${{ steps.target.outputs.execution_id }}.json

      - name: Execute history bypass probe
        if: always()
        run: |
          python interface/adapters/gnozis_core/history_bypass.py \
            --core-revision "${{ steps.target.outputs.revision }}" \
            --execution-id "HISTORY-BYPASS-${{ steps.target.outputs.execution_id }}" \
            --report interface/reports/HISTORY-BYPASS-${{ steps.target.outputs.execution_id }}.json

      - name: Execute tampered provenance probe
        if: always()
        run: |
          python interface/adapters/gnozis_core/tampered_provenance.py \
            --core-revision "${{ steps.target.outputs.revision }}" \
            --execution-id "PROVENANCE-TAMPER-${{ steps.target.outputs.execution_id }}" \
            --report interface/reports/PROVENANCE-TAMPER-${{ steps.target.outputs.execution_id }}.json

      - name: Validate execution report exists
        if: always()
        run: test -s interface/reports/${{ steps.target.outputs.execution_id }}.json

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.execution_id }}
          path: interface/reports/${{ steps.target.outputs.execution_id }}.json
          if-no-files-found: error
