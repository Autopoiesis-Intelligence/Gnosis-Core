name: E7.111 Independent Audit Verification
on:
  push:
    paths:
      - "gnosis/self_learning/e7_111_independent_audit.py"
      - "tests/test_e7_111_independent_audit.py"
  workflow_dispatch:
jobs:
  e7-111:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run E7.111 tests
        run: pytest -q tests/test_e7_111_independent_audit.py
