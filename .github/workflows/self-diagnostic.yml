name: Self-Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gnosis/reflection/**'
      - 'gnosis/core/**'
      - 'gnosis/storage/**'
      - 'gnosis/self_learning/**'
      - 'tests/**'
      - 'diagnostic_corpus/**'
      - '.github/workflows/self-diagnostic.yml'
  push:
    paths:
      - 'gnosis/reflection/**'
      - 'gnosis/core/**'
      - 'gnosis/storage/**'
      - 'gnosis/self_learning/**'
      - 'tests/**'
      - 'diagnostic_corpus/**'
      - '.github/workflows/self-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run diagnostic contract tests
        run: pytest -q tests/test_diagnostic_corpus.py tests/test_diagnostic_execution.py tests/test_diagnostic_artifact.py tests/test_causal_attribution.py tests/test_persistence.py tests/test_transition_identity_integrity.py tests/test_transition_identity_integrity_valid.py tests/test_transition_audit_link_integrity.py tests/test_audit_hash_tamper_integrity.py tests/test_transition_replay_idempotency.py tests/test_persistence_crash_reopen.py
      - name: Generate persisted Core history and diagnose it
        run: python diagnostic_corpus/generate.py --output-dir "${{ runner.temp }}/SELF-DIAGNOSTIC-0001"
      - name: Upload self-diagnostic evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: self-diagnostic-${{ matrix.python-version }}
          path: ${{ runner.temp }}/SELF-DIAGNOSTIC-0001/
          if-no-files-found: error
