name: Self-Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'gnosis/reflection/**'
      - 'gnosis/core/**'
      - 'gnosis/storage/**'
      - 'gnosis/self_learning/**'
      - 'tests/**'
      - '.github/workflows/self-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run reflection and persistence tests
        run: pytest -q tests/test_rule_provenance.py tests/test_causal_attribution.py tests/test_diagnostic_artifact.py tests/test_persistence.py tests/test_transition_identity_integrity.py tests/test_transition_identity_integrity_valid.py tests/test_transition_audit_link_integrity.py tests/test_audit_hash_tamper_integrity.py tests/test_transition_replay_idempotency.py tests/test_persistence_crash_reopen.py tests/test_diagnostic_corpus.py tests/test_diagnostic_execution.py tests/test_self_learning_contract_database.py tests/test_self_learning_knowledge.py tests/test_self_learning_lineage.py tests/test_self_learning_promotion.py tests/test_self_learning_integration.py tests/test_self_learning_bridge.py tests/test_self_learning_core_execution_bridge.py tests/test_self_learning_cycle.py tests/test_self_learning_execution_boundary.py tests/test_self_learning_contract_generator.py tests/test_specialized_core.py tests/test_self_learning_delivery.py tests/test_training_intake.py tests/test_training_plan.py tests/test_execution_receipt.py tests/test_core_build.py tests/test_release_gate.py tests/test_delivery_authorization.py tests/test_delivery_receipt.py tests/test_feedback_proposal.py tests/test_feedback_validation.py tests/test_feedback_promotion.py tests/test_collaboration_proposal.py tests/test_collaboration_execution_authorization.py tests/test_collaboration_execution_evidence.py tests/test_collaboration_recovery.py tests/test_collaboration_incident_resolution.py tests/test_remediation_plan.py tests/test_remediation_execution_authorization.py tests/test_remediation_verification.py tests/test_collaboration_lifecycle_closure.py tests/test_evidence_retention.py tests/test_audit_package.py tests/test_auditor_attestation.py tests/test_audit_challenge.py tests/test_learning_evidence_admission.py tests/test_evidence_normalization.py
      - name: Generate persisted Core history and diagnose it
        run: python diagnostic_corpus/generate.py
      - name: Upload self-diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-diagnostic-${{ matrix.python-version }}
          path: diagnostic_corpus/SELF-DIAGNOSTIC-0001/diagnostic.json
