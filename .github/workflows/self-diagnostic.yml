name: Self-Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'gnosis/reflection/**'
      - 'gnosis/core/**'
      - 'gnosis/storage/**'
      - 'gnosis/self_learning/**'
      - 'tests/**'
      - '.github/workflows/self-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Environment preflight
        run: |
          python --version
          pip --version
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Import preflight
        run: python -c "import gnosis; print(gnosis.__file__)"
      - name: R13 manifest contract
        run: pytest -q tests/test_executable_manifest_contract.py
      - name: Run reflection and persistence tests
        run: pytest -q tests/test_rule_provenance.py tests/test_causal_attribution.py tests/test_diagnostic_artifact.py tests/test_persistence.py tests/test_transition_identity_integrity.py tests/test_transition_identity_integrity_valid.py tests/test_transition_audit_link_integrity.py tests/test_audit_hash_tamper_integrity.py tests/test_transition_replay_idempotency.py tests/test_persistence_crash_reopen.py tests/test_diagnostic_corpus.py tests/test_diagnostic_execution.py tests/test_self_learning_contract_database.py tests/test_self_learning_knowledge.py tests/test_self_learning_lineage.py tests/test_self_learning_promotion.py tests/test_self_learning_integration.py tests/test_self_learning_bridge.py tests/test_self_learning_core_execution_bridge.py tests/test_self_learning_cycle.py tests/test_self_learning_execution_boundary.py tests/test_self_learning_contract_generator.py tests/test_specialized_core.py tests/test_self_learning_delivery.py tests/test_training_intake.py tests/test_training_plan.py tests/test_execution_receipt.py tests/test_core_build.py tests/test_release_gate.py tests/test_delivery_authorization.py tests/test_delivery_receipt.py tests/test_partner_result.py tests/test_partner_replay.py tests/test_feedback_classification.py tests/test_partner_learning_gate.py tests/test_e821_integration.py tests/test_partner_learning_adapter.py tests/test_persistence_adapter.py tests/test_partner_transaction.py tests/test_feedback_proposal.py tests/test_feedback_validation.py tests/test_feedback_promotion.py tests/test_collaboration_proposal.py tests/test_contract_generation.py tests/test_transfer_boundary.py tests/test_collaboration_execution_authorization.py tests/test_collaboration_execution_evidence.py tests/test_collaboration_recovery.py tests/test_collaboration_incident_resolution.py tests/test_remediation_plan.py tests/test_remediation_execution_authorization.py tests/test_remediation_verification.py tests/test_collaboration_lifecycle_closure.py tests/test_evidence_retention.py tests/test_audit_package.py tests/test_auditor_attestation.py tests/test_audit_challenge.py tests/test_learning_evidence_admission.py tests/test_evidence_normalization.py tests/test_pattern_extraction.py tests/test_candidate_contract.py tests/test_shadow_evaluation.py tests/test_learning_proposal.py tests/test_governance_decision.py tests/test_controlled_commit.py tests/test_post_commit_verification.py tests/test_evolution_memory.py tests/test_learning_cycle.py tests/test_learning_input.py tests/test_opportunity_grid.py tests/test_opportunity_reclassification.py tests/test_contract_formation.py tests/test_self_analysis.py tests/test_improvement_proposal.py tests/test_proposal_gate.py tests/test_execution_boundary.py tests/test_verification_feedback.py tests/test_feedback_integration.py tests/test_engine_authorized_policy_path.py tests/test_transition_provenance_policy_bridge.py tests/test_engine_provenance_round_trip.py tests/test_provenance_persistence_mapping.py tests/test_provenance_persistence_matrix.py tests/test_provenance_closure.py tests/test_learning_commit_gate.py tests/test_opportunity_update.py tests/test_commercial_evidence_gate.py tests/test_partnership_proposal.py tests/test_collaboration_proposal.py
      - name: Generate R13 manifest verification artifact
        run: |
          mkdir -p diagnostic_corpus/SELF-DIAGNOSTIC-0001
          python - <<'PY'
          import json
          from pathlib import Path
          from gnosis.core.policy import PolicyIdentity, executable_binding_manifest_digest
          from gnosis.core.types import Candidate, State
          parent = State(elements={"x": 1})
          candidate = Candidate(parent_state_id=parent.state_id, proposed_state=parent.with_elements({"x": 2}), origin="manifest-contract", seed=1)
          policy = PolicyIdentity("test-rule", 1, "python-source-sha256:impl-a")
          digest = executable_binding_manifest_digest(candidate=candidate, parent_state_digest=parent.state_id, policy=policy)
          Path("diagnostic_corpus/SELF-DIAGNOSTIC-0001/manifest-contract.json").write_text(json.dumps({"manifest_digest": digest, "policy": policy.__dict__ if hasattr(policy, "__dict__") else str(policy)}, sort_keys=True))
          PY
      - name: Generate persisted Core history and diagnose it
        run: python diagnostic_corpus/generate.py
      - name: Upload self-diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-diagnostic-${{ matrix.python-version }}
          path: diagnostic_corpus/SELF-DIAGNOSTIC-0001/diagnostic.json
