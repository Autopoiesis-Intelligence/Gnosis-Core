name: Observer Runtime Probe

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create runtime marker
        run: |
          printf 'OBSERVER_RUNTIME_PROBE=STARTED\n' > observer-runtime-probe.txt
          printf 'SHA=%s\n' "${GITHUB_SHA}" >> observer-runtime-probe.txt
      - name: Upload runtime marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-runtime-probe-${{ github.run_id }}
          path: observer-runtime-probe.txt
          if-no-files-found: error
