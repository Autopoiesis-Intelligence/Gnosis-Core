name: E7.108 Execution Record Verification
on:
  push:
    paths:
      - "gnosis/self_learning/e7_108_execution_record.py"
      - "tests/test_e7_108_execution_record.py"
  workflow_dispatch:
jobs:
  e7-108:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run E7.108 tests
        run: pytest -q tests/test_e7_108_execution_record.py
