name: E7.112 Immutable Closure Verification
on:
  push:
    paths:
      - "gnosis/self_learning/e7_112_immutable_closure.py"
      - "tests/test_e7_112_immutable_closure.py"
  workflow_dispatch:
jobs:
  e7-112:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run E7.112 tests
        run: pytest -q tests/test_e7_112_immutable_closure.py
