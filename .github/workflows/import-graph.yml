name: Import Graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build import graph
        shell: bash
        run: |
          set +e
          python tools/build_import_graph.py
          status=$?
          echo "IMPORT_GRAPH_EXIT_CODE=$status"
          exit "$status"
      - name: Run import graph test
        run: pytest -q tests/test_import_graph.py
