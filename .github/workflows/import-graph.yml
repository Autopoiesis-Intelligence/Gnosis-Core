name: Import Graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build import graph
        run: python tools/build_import_graph.py
      - name: Run import graph test
        run: pytest -q tests/test_import_graph.py
