name: E7.113 Bounded Proof Execution
on:
  workflow_dispatch:
  push:
    branches:
      - "contract/first-governed-task-20261002"
    paths:
      - "gnosis/self_learning/e7_113_execute_bounded_proof.py"
      - "gnosis/self_learning/execution.py"
      - "gnosis/reflection/execution_adapter.py"
      - "tests/**"
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Execute bounded proof run
        env:
          E7_RUN_ID: e7-113-${{ github.run_id }}
        run: python -m gnosis.self_learning.e7_113_execute_bounded_proof
      - name: Upload proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: e7-113-proof-evidence
          path: proof-run-evidence.json
