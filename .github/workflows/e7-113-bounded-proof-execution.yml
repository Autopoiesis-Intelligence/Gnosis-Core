name: E7.113 Bounded Proof Execution
on:
  workflow_dispatch:
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Execute real bounded proof run
        env:
          E7_RUN_ID: e7-113-${{ github.run_id }}
        run: python -m gnosis.self_learning.e7_113_ci_entrypoint
      - name: Upload proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: e7-113-proof-evidence
          path: artifacts/e7-113/proof-run-evidence.json
