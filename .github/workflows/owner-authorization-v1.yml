name: owner-authorization-v1-gate

on:
  push:
    branches:
      - "e8-64-32-owner-authorization-v1"
  pull_request:
    paths:
      - "gnosis/reflection/owner_authorization.py"
      - "tests/test_owner_authorization.py"
      - "pyproject.toml"
      - ".github/workflows/owner-authorization-v1.yml"

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install cryptography
      - run: python -m pytest -q tests/test_owner_authorization.py
