[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnosis2"
version = "2.0.0.dev1"
description = "Gnosis Core — verifiable state, relation, candidate evaluation and governed evolution"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
# Analytics deps are intentionally kept OUT of core dependencies (spec 44).
analytics = ["numpy", "networkx", "scipy"]

[tool.setuptools.packages.find]
include = ["gnosis*", "diagnostic_corpus*", "registry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
